apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-migrations
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $path, $_ := .Files.Glob "migrations/*.sql" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  run-migrations.sh: |
    #!/bin/sh
    set -e
    # Bounded wait, and credentials errors fail at once so migration failures
    # are visible in kubectl and Argo health.
    echo "⏳ Waiting for ClickHouse to be ready..."
    tries=0
    until out=$(clickhouse-client --host="$CH_HOST" --port="$CH_PORT" \
          --user="$CH_USER" --password="$CH_PASSWORD" \
          --query="SELECT 1" 2>&1); do
      case "$out" in
        *AUTHENTICATION_FAILED*|*UNKNOWN_USER*|*REQUIRED_PASSWORD*)
          echo "❌ ClickHouse rejected the credentials of user '$CH_USER':" >&2
          echo "$out" >&2
          exit 1
          ;;
      esac
      tries=$((tries + 1))
      if [ "$tries" -ge 100 ]; then
        echo "❌ ClickHouse at $CH_HOST:$CH_PORT not ready after $tries attempts; last error:" >&2
        echo "$out" >&2
        exit 1
      fi
      echo "  ClickHouse not ready ($tries/100), retrying in 3s..."
      sleep 3
    done

    echo "⏳ Creating database '$CH_DATABASE'..."
    clickhouse-client --host="$CH_HOST" --port="$CH_PORT" \
      --user="$CH_USER" --password="$CH_PASSWORD" \
      --query="CREATE DATABASE IF NOT EXISTS $CH_DATABASE"

    echo "⏳ Running migrations..."
    for f in /migrations/*.sql; do
      echo "  → $(basename $f)"
      if [ "$(basename "$f")" = "028_ingestion_queue_created_at_datetime64.up.sql" ]; then
        applied="$(clickhouse-client --host="$CH_HOST" --port="$CH_PORT" \
          --user="$CH_USER" --password="$CH_PASSWORD" \
          --database="$CH_DATABASE" \
          --query="SELECT count() FROM data_migrations FINAL WHERE name = 'ingestion_queue_created_at_datetime64'")"
        if [ "$applied" != "0" ]; then
          echo "  ↪ already applied"
          continue
        fi
      fi
      clickhouse-client --host="$CH_HOST" --port="$CH_PORT" \
        --user="$CH_USER" --password="$CH_PASSWORD" \
        --database="$CH_DATABASE" --multiquery < "$f"
    done
    echo "✅ Database initialized."
