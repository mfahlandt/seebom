{{- if .Values.mcp.enabled }}
{{- /*
  MCP Server (#399).

  Deliberately does *not* pull in the release-wide ConfigMap/Secret the other
  components use: it is a consumer of the REST API, so it has no business
  holding ClickHouse credentials, S3 keys or a GitHub token. Every variable it
  needs is listed explicitly below — which is also how one can tell, from the
  manifest alone, that this pod cannot read the database directly.

  The `http` transport is remote tool execution. The binary refuses to start
  without MCP_HTTP_TOKEN and a non-wildcard MCP_ALLOWED_ORIGINS, so a
  misconfigured release fails at CrashLoopBackOff rather than serving an open
  endpoint. The failing log line names the missing value.
*/}}
{{- if eq .Values.mcp.transport "http" }}
{{- if and (not .Values.mcp.httpToken) (not .Values.mcp.existingSecret.enabled) }}
{{- fail "mcp.transport=http requires mcp.httpToken or mcp.existingSecret.enabled — an unauthenticated MCP endpoint is remote tool execution" }}
{{- end }}
{{- if not .Values.mcp.allowedOrigins }}
{{- fail "mcp.transport=http requires a non-empty mcp.allowedOrigins list — list the origins explicitly, '*' is rejected" }}
{{- end }}
{{- if has "*" .Values.mcp.allowedOrigins }}
{{- fail "mcp.allowedOrigins must not contain '*' — list the origins explicitly" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bomhort
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bomhort
        app.kubernetes.io/component: mcp-server
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/mcp-server:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.mcp.transport "http" }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: MCP_TRANSPORT
              value: {{ .Values.mcp.transport | quote }}
            {{- if eq .Values.mcp.transport "http" }}
            # 0.0.0.0, not the binary's loopback default: a Service has to be
            # able to reach it. The token and the origin list are what keep it
            # closed, not the bind address.
            - name: MCP_HTTP_ADDR
              value: "0.0.0.0:{{ .Values.mcp.port }}"
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," .Values.mcp.allowedOrigins | quote }}
            - name: MCP_HTTP_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.mcp.existingSecret.enabled }}
                  name: {{ .Values.mcp.existingSecret.secretName }}
                  key: {{ .Values.mcp.existingSecret.httpTokenKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-mcp-auth
                  key: MCP_HTTP_TOKEN
                  {{- end }}
            {{- end }}
            - name: MCP_API_BASE_URL
              value: {{ .Values.mcp.apiBaseURL | default (printf "http://%s-api-gateway.%s.svc.cluster.local:%v" .Release.Name .Release.Namespace .Values.apiGateway.service.port) | quote }}
            - name: MCP_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.mcp.requestTimeoutSeconds | quote }}
            {{- /*
              Credentials sent *to* the gateway. Explicit values win; otherwise
              the same Secret the gateway itself reads is mounted, because in
              the normal case this is the same release and repeating the token
              under a second name is how the two drift apart.
            */}}
            {{- if .Values.mcp.serviceToken }}
            - name: MCP_SERVICE_TOKEN
              value: {{ .Values.mcp.serviceToken | quote }}
            {{- else if .Values.apiGateway.auth.enabled }}
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.apiGateway.auth.existingSecret.enabled }}
                  name: {{ .Values.apiGateway.auth.existingSecret.secretName }}
                  key: {{ .Values.apiGateway.auth.existingSecret.serviceTokenKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-api-auth
                  key: SERVICE_TOKEN
                  {{- end }}
                  optional: true
            {{- end }}
            {{- if .Values.mcp.apiKey }}
            - name: MCP_API_KEY
              value: {{ .Values.mcp.apiKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}

