apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-parsing-worker
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: parsing-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.parsingWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bomhort
      app.kubernetes.io/component: parsing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bomhort
        app.kubernetes.io/component: parsing-worker
        {{- if not .Values.gitSync.enabled }}
        bomhort.io/sbom-volume: "true"
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not .Values.gitSync.enabled }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: bomhort.io/sbom-volume
                    operator: Exists
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if .Values.gitSync.enabled }}
      initContainers:
        - name: git-sync-init
          image: {{ .Values.gitSync.image }}
          args:
            - --repo={{ .Values.gitSync.repo }}
            - --ref={{ .Values.gitSync.branch }}
            - --depth={{ .Values.gitSync.depth }}
            - --root={{ .Values.gitSync.root }}
            - --one-time
            {{- if .Values.gitSync.timeout }}
            - --sync-timeout={{ .Values.gitSync.timeout }}s
            {{- end }}
          volumeMounts:
            - name: sbom-data
              mountPath: {{ .Values.gitSync.root }}
          {{- if .Values.gitSync.secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.gitSync.secretName }}
          {{- end }}
      {{- end }}
      containers:
        - name: parsing-worker
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}/parsing-worker:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secret
          {{- $exceptionsEnv := include "bomhort.licenseExceptions.env" . }}
          {{- if or .Values.s3.credentialsSecret.enabled $exceptionsEnv }}
          env:
            {{- if .Values.s3.credentialsSecret.enabled }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.secretName }}
                  key: {{ .Values.s3.credentialsSecret.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.credentialsSecret.secretName }}
                  key: {{ .Values.s3.credentialsSecret.secretKeyKey }}
            {{- end }}
            {{- with $exceptionsEnv }}{{ . | trim | nindent 12 }}{{ end }}
          {{- end }}
          resources:
            {{- toYaml .Values.parsingWorker.resources | nindent 12 }}
          volumeMounts:
            - name: sbom-data
              mountPath: {{ .Values.sbomSource.mountPath }}
              readOnly: true
            {{- /* No rollout checksum: the pods re-read the mounted
                 directory and re-check stored results themselves. */}}
            {{- with include "bomhort.licenseExceptions.volumeMount" . }}{{ . | trim | nindent 12 }}{{ end }}
            {{- if .Values.licensePolicy.enabled }}
            - name: license-policy
              mountPath: {{ .Values.licensePolicy.mountPath }}
              subPath: license-policy.json
              readOnly: true
            {{- end }}
            {{- if .Values.originalStore.fs.enabled }}
            - name: originals
              mountPath: {{ .Values.originalStore.fs.mountPath }}
            {{- end }}
      volumes:
        - name: sbom-data
          {{- if .Values.gitSync.enabled }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.sbomSource.pvcName }}
          {{- end }}
        {{- if .Values.originalStore.fs.enabled }}
        - name: originals
          persistentVolumeClaim:
            claimName: {{ .Values.originalStore.fs.pvcName }}
        {{- end }}
        {{- with include "bomhort.licenseExceptions.volume" . }}{{ . | trim | nindent 8 }}{{ end }}
        {{- with .Values.licensePolicy }}
        {{- if .enabled }}
        - name: license-policy
          configMap:
            {{- if .existingConfigMap }}
            name: {{ .existingConfigMap }}
            items:
              - key: {{ .existingConfigMapKey | default "license-policy.json" }}
                path: license-policy.json
            {{- else }}
            name: {{ $.Release.Name }}-license-policy
            {{- end }}
        {{- end }}
        {{- end }}

