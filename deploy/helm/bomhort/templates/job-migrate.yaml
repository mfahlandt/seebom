{{- /*
  Schema migrations. The Job name is derived from what it would run — the
  rendered migrations ConfigMap and the Job spec — not from
  .Release.Revision. Argo CD renders the chart with `helm template`, where
  the revision is always 1: the Job kept its name, was never re-run for new
  migrations, and any change to its (immutable) pod template failed the
  sync. A content-derived name gives a new Job exactly when a migration, the
  script or the spec changes, and the same Job — nothing to do — otherwise.
  The migrations are idempotent (IF NOT EXISTS), so a re-run is harmless.
*/}}
{{- $configMap := include (print $.Template.BasePath "/configmap-migrations.yaml") . }}
{{- $spec := include "bomhort.migrateJob.spec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ printf "%s\n---\n%s" $configMap $spec | sha256sum | trunc 10 }}
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
{{ $spec | trim | indent 2 }}

{{- define "bomhort.migrateJob.spec" -}}
{{- if .Values.cleanBatchJobs }}
ttlSecondsAfterFinished: 300
{{- end }}
backoffLimit: 10
template:
  metadata:
    labels:
      app.kubernetes.io/name: bomhort
      app.kubernetes.io/component: migrate
  spec:
    restartPolicy: OnFailure
    containers:
      - name: migrate
        image: {{ .Values.clickhouse.installation.podTemplate.containerImage }}
        command: ["/bin/sh", "/scripts/run-migrations.sh"]
        env:
          - name: CH_HOST
            value: {{ .Values.clickhouse.host | quote }}
          - name: CH_PORT
            value: {{ .Values.clickhouse.port | quote }}
          - name: CH_DATABASE
            value: {{ .Values.clickhouse.database | quote }}
          - name: CH_USER
            value: {{ .Values.clickhouse.user | quote }}
          - name: CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ ternary .Values.clickhouse.userPasswordSecret.secretName (printf "%s-secret" .Release.Name) .Values.clickhouse.userPasswordSecret.enabled }}
                key: {{ ternary .Values.clickhouse.userPasswordSecret.key "CLICKHOUSE_PASSWORD" .Values.clickhouse.userPasswordSecret.enabled }}
        volumeMounts:
          - name: migrations
            mountPath: /migrations
            readOnly: true
          - name: scripts
            mountPath: /scripts
            readOnly: true
    volumes:
      - name: migrations
        configMap:
          name: {{ .Release.Name }}-migrations
          items:
            {{- range $path, $_ := .Files.Glob "migrations/*.sql" }}
            - key: {{ base $path }}
              path: {{ base $path }}
            {{- end }}
      - name: scripts
        configMap:
          name: {{ .Release.Name }}-migrations
          defaultMode: 0755
          items:
            - key: run-migrations.sh
              path: run-migrations.sh
{{- end }}
