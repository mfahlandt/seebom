{{- /*
  The content-derived name changes when the migration ConfigMap or Job spec
  changes. As a Helm hook, the Job runs before installs/upgrades and is
  deleted after success; migration markers keep one-off data changes from
  running again.
*/}}
{{- $configMap := include (print $.Template.BasePath "/configmap-migrations.yaml") . }}
{{- $spec := include "bomhort.migrateJob.spec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ printf "%s\n---\n%s" $configMap $spec | sha256sum | trunc 10 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
{{ $spec | trim | indent 2 }}

{{- define "bomhort.migrateJob.spec" -}}
{{- if .Values.cleanBatchJobs }}
ttlSecondsAfterFinished: 300
{{- end }}
backoffLimit: 10
activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
template:
  metadata:
    labels:
      app.kubernetes.io/name: bomhort
      app.kubernetes.io/component: migrate
  spec:
    restartPolicy: OnFailure
    containers:
      - name: migrate
        image: {{ .Values.clickhouse.installation.podTemplate.containerImage }}
        command: ["/bin/sh", "/scripts/run-migrations.sh"]
        env:
          - name: CH_HOST
            value: {{ .Values.clickhouse.host | quote }}
          - name: CH_PORT
            value: {{ .Values.clickhouse.port | quote }}
          - name: CH_DATABASE
            value: {{ .Values.clickhouse.database | quote }}
          - name: CH_USER
            value: {{ .Values.clickhouse.user | quote }}
          - name: CH_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ ternary .Values.clickhouse.userPasswordSecret.secretName (printf "%s-secret" .Release.Name) .Values.clickhouse.userPasswordSecret.enabled }}
                key: {{ ternary .Values.clickhouse.userPasswordSecret.key "CLICKHOUSE_PASSWORD" .Values.clickhouse.userPasswordSecret.enabled }}
        volumeMounts:
          - name: migrations
            mountPath: /migrations
            readOnly: true
          - name: scripts
            mountPath: /scripts
            readOnly: true
    volumes:
      - name: migrations
        configMap:
          name: {{ .Release.Name }}-migrations
          items:
            {{- range $path, $_ := .Files.Glob "migrations/*.sql" }}
            - key: {{ base $path }}
              path: {{ base $path }}
            {{- end }}
      - name: scripts
        configMap:
          name: {{ .Release.Name }}-migrations
          defaultMode: 0755
          items:
            - key: run-migrations.sh
              path: run-migrations.sh
{{- end }}
