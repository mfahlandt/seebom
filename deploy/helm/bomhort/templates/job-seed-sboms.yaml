{{- if .Values.seedJob.cncfExceptionsURL }}
{{- fail "seedJob.cncfExceptionsURL is no longer supported: remove it and provide reviewed rules via licenseExceptions.custom, --set-file licenseExceptions.custom=./my-exceptions.json or licenseExceptions.existingConfigMap" }}
{{- end }}
{{- if .Values.seedJob.enabled }}
{{- if .Values.gitSync.enabled }}
{{- fail "seedJob.enabled and gitSync.enabled are mutually exclusive: git-sync fills an emptyDir on every run, the seed job fills the PVC once" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seed-sboms-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: seed-sboms
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if .Values.cleanBatchJobs }}
  ttlSecondsAfterFinished: 300
  {{- end }}
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.seedJob.activeDeadlineSeconds | default 1800 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bomhort
        app.kubernetes.io/component: seed-sboms
        bomhort.io/sbom-volume: "true"
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ .Values.seedJob.image }}
          env:
            - name: SBOM_REPO
              value: {{ .Values.seedJob.sbomRepo | quote }}
            - name: SBOM_BRANCH
              value: {{ .Values.seedJob.sbomBranch | default "main" | quote }}
            - name: SBOM_PATH
              value: {{ .Values.seedJob.path | default "" | quote }}
            - name: TARGET
              value: {{ .Values.sbomSource.mountPath | quote }}
          {{- if .Values.seedJob.secretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.seedJob.secretName }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -n "${GIT_USERNAME:-}" ] && [ -n "${GIT_PASSWORD:-}" ]; then
                git config --global credential.helper '!f() { echo "username=$GIT_USERNAME"; echo "password=$GIT_PASSWORD"; }; f'
              fi
              echo "Cloning $SBOM_REPO (branch $SBOM_BRANCH) ..."
              git clone --quiet --depth 1 --single-branch --branch "$SBOM_BRANCH" "$SBOM_REPO" /tmp/sbom-repo
              SRC="/tmp/sbom-repo/${SBOM_PATH#/}"
              SRC="${SRC%/}"
              if [ ! -d "$SRC" ]; then
                echo "seedJob.path '$SBOM_PATH' does not exist in $SBOM_REPO" >&2
                exit 1
              fi
              echo "Copying $SRC -> $TARGET (directory structure preserved) ..."
              rm -rf /tmp/sbom-repo/.git
              mkdir -p "$TARGET"
              cp -R "$SRC/." "$TARGET/"
              SBOM_COUNT=$(find "$TARGET" -type f -name '*.json' ! -name '*.openvex.json' ! -name '*.vex.json' | wc -l | tr -d ' ')
              VEX_COUNT=$(find "$TARGET" -type f \( -name '*.openvex.json' -o -name '*.vex.json' \) | wc -l | tr -d ' ')
              echo "Seed complete: $SBOM_COUNT SBOM files, $VEX_COUNT VEX files in $TARGET"
          volumeMounts:
            - name: sbom-data
              mountPath: {{ .Values.sbomSource.mountPath }}
          resources:
            requests:
              ephemeral-storage: "4Gi"
            limits:
              ephemeral-storage: "10Gi"
      volumes:
        - name: sbom-data
          persistentVolumeClaim:
            claimName: {{ .Values.sbomSource.pvcName }}
{{- end }}
