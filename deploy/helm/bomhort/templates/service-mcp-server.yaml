{{- if and .Values.mcp.enabled (eq .Values.mcp.transport "http") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.mcp.service.type }}
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.mcp.service.type "NodePort") .Values.mcp.service.nodePort }}
      nodePort: {{ .Values.mcp.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: bomhort
    app.kubernetes.io/component: mcp-server
{{- end }}

