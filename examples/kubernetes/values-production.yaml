# BOMHort – Production Helm Values
#
# Suitable for a real Kubernetes cluster (EKS, GKE, AKS, self-hosted).
# Default ingestion: S3 buckets (set s3.buckets). Fallback: a PVC you populate.
# HA replicas, ClusterIP services.
#
# Usage:
#   helm install bomhort deploy/helm/bomhort/ -n bomhort -f values-production.yaml \
#     --set clickhouse.password=<PASSWORD> \
#     --set 's3.buckets=[{"name":"my-org-sboms","region":"us-east-1"}]'

# ─── Images ──────────────────────────────────────────────────────────────────
image:
  registry: ghcr.io
  repository: seebom-labs/bomhort
  # Omitted on purpose: the chart defaults to its own appVersion, so the
  # images always match the chart you installed. Set it only to pin one.
  pullPolicy: IfNotPresent

# ─── ClickHouse ──────────────────────────────────────────────────────────────
clickhouse:
  host: chi-bomhort-clickhouse-bomhort-cluster-0-0
  port: 9000
  database: bomhort
  user: default
  password: ""   # pass via --set or reference an existing K8s Secret
  cluster:
    name: bomhort-cluster
    shardsCount: 1
    replicasCount: 2         # 2 replicas for HA
  installation:
    podTemplate:
      containerImage: docker.io/clickhouse/clickhouse-server:24.8.14.39@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
    volumeClaimTemplate:
      dataStorage: 50Gi      # production workloads need more storage
      logStorage: 1Gi

# ─── GitHub ──────────────────────────────────────────────────────────────────
github:
  token: ""   # pass via --set or reference an existing K8s Secret

# ─── S3 Bucket Ingestion (default, recommended) ─────────────────────────────
# Ingest SBOMs directly from S3 buckets. No PVC or git-sync needed.
# Works alongside local files if both are configured.
s3:
  # Example: ingest from two SBOM buckets
  # buckets: '[{"name":"my-org-sboms","region":"us-east-1"},{"name":"platform-sboms","region":"us-east-1"}]'
  buckets: ""
  accessKey: ""   # pass via --set for private buckets
  secretKey: ""   # pass via --set for private buckets
  # Or reference an existing Kubernetes Secret (recommended for production):
  # credentialsSecret:
  #   enabled: true
  #   secretName: "my-s3-credentials"
  #   accessKeyKey: "S3_ACCESS_KEY"
  #   secretKeyKey: "S3_SECRET_KEY"

# ─── SBOM Source via PVC (alternative to S3) ─────────────────────────────────
# Only needed if S3 is not available. For S3-based ingestion, set s3.buckets above.
# The chart creates the PVC empty; populate it yourself (CI job, kubectl cp).
gitSync:
  enabled: false

sbomSource:
  pvcName: bomhort-sbom-data
  mountPath: /data/sboms
  storageSize: 20Gi

# ─── License Config ─────────────────────────────────────────────────────────
# Default: the policy bundled with the chart
# (permissive SPDX IDs pass, everything else needs an exception)
licenseExceptions:
  enabled: true
  mountPath: /data/config/license-exceptions/license-exceptions.json
  custom: "" # No approvals by default; see examples/license-exceptions/.
  # API and workers re-read the rules at this interval; a change is applied
  # to every SBOM already ingested (no restart, no re-scan). "0" = read once.
  refreshInterval: 60s
  #
  # Alternative 1 — a ConfigMap managed outside the chart (kustomize, a
  # second Argo CD source). Mutually exclusive with custom:
  # existingConfigMap: license-exceptions
  # existingConfigMapKey: license-exceptions.json
  #
  # Alternative 2 — rules that live outside the cluster, e.g. in a governance
  # repository. Mutually exclusive with custom and existingConfigMap; nothing
  # is mounted. Only https:// or s3://bucket/key (uses the s3.* credentials).
  # source: https://raw.githubusercontent.com/your-org/governance/main/license-exceptions.json
  # sourceTokenSecret:   # private repository: sent as "Authorization: Bearer <token>"
  #   name: governance-token
  #   key: token
  # refreshInterval: 5m

licensePolicy:
  enabled: true
  mountPath: /data/config/license-policy.json
  # Override the default policy if your org has different rules:
  # custom: |
  #   {
  #     "description": "My org policy",
  #     "permissive": ["Apache-2.0", "MIT", "BSD-3-Clause"],
  #     "copyleft": ["GPL-2.0-only", "GPL-3.0-only", "AGPL-3.0-only"]
  #   }

# ─── Ingestion Watcher ──────────────────────────────────────────────────────
ingestionWatcher:
  schedule: "0 */6 * * *"    # Every 6 hours
  sbomLimit: 0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── Parsing Workers ────────────────────────────────────────────────────────
parsingWorker:
  replicas: 5                # scale up for faster processing
  batchSize: 50
  skipOSV: false
  skipGitHubResolve: false
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1", memory: 1Gi }

# ─── API Gateway ────────────────────────────────────────────────────────────
apiGateway:
  replicas: 2                # HA
  port: 8080
  service:
    type: ClusterIP          # use Ingress to expose
    port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ─── UI ─────────────────────────────────────────────────────────────────────
ui:
  replicas: 2                # HA
  service:
    type: ClusterIP          # use Ingress to expose
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  customTheme:
    enabled: false
  siteConfig:
    enabled: false

# ─── CVE Refresher ──────────────────────────────────────────────────────────
cveRefresher:
  enabled: true
  schedule: "0 2 * * *"      # Daily at 2 AM
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

